[build-system]
requires = ["setuptools>=80", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "churn-prediction"
version = "0.1.0"
description = "Churn prediction MLP PyTorch - FIAP Tech Challenge Fase 1"
requires-python = ">=3.10"
dependencies = [
    # Deep Learning
    "torch>=2.10.0",
    # ML / Data
    "scikit-learn>=1.3.0",
    "pandas>=2.0.0",
    "numpy>=1.24.0,<2.0.0",
    "imbalanced-learn>=0.12.0",   # SMOTE — class imbalance (~26% churn no Telco)
    "joblib>=1.3.0",
    # Experiment tracking
    "mlflow>=2.10.0",
    # API
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    # Data validation
    "pandera>=0.18.0",
    "openpyxl>=3.1.0",             # leitura de arquivos Excel (opcional)
    # Utilities
    "python-dotenv>=1.0.0",       # carregamento de .env (seeds, paths)
    "loguru>=0.7.2",              # logging estruturado — obrigatório pelo Tech Challenge
    # Visualização
    "matplotlib>=3.7.0",
    "seaborn>=0.12.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "httpx>=0.25.0",              # testes da API FastAPI
    "ruff>=0.3.0",
    "ipykernel>=6.29.0",          # notebooks no VSCode e PyCharm
    "jupyter>=1.0.0",
    "plotly>=5.22.0",             # visualizações interativas no EDA
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

# ── Ruff ─────────────────────────────────────────────────────────────────────
[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]
"notebooks/*" = ["E402", "F401"]

# ── Pytest ───────────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short --cov=src --cov-report=term-missing"

# ── Coverage ─────────────────────────────────────────────────────────────────
[tool.coverage.run]
source = ["src"]
omit = ["tests/*", "notebooks/*"]
